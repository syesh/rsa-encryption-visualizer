<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSA Cryptography Guided Lab</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #090d16;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #f1f5f9;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(129, 140, 248, 0.2);
        border-top-color: #818cf8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-title {
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(90deg, #818cf8, #c084fc, #e879f9);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
      }
      .loading-sub {
        font-size: 14px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="loader" class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-title">🔐 RSA Virtual Laboratory</div>
      <div class="loading-sub">Loading interactive WebAssembly environment...</div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
    <script>
      fetch('./app.py')
        .then(function(res) {
          if (!res.ok) {
            throw new Error("HTTP error " + res.status);
          }
          return res.text();
        })
        .then(function(code) {
          stlite.mount(
            {
              entrypoint: "app.py",
              files: {
                "app.py": code,
              },
            },
            document.getElementById("root")
          );
          setTimeout(function() {
            var loader = document.getElementById("loader");
            if (loader) {
              loader.style.opacity = "0";
              loader.style.visibility = "hidden";
            }
          }, 800);
        })
        .catch(function(err) {
          console.error("Failed to load app.py:", err);
          var sub = document.querySelector(".loading-sub");
          if (sub) {
            sub.textContent = "Error loading application script. Please refresh.";
            sub.style.color = "#ef4444";
          }
        });
    </script>
  </body>
</html>
