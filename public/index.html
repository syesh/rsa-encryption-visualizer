<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSA Cryptography Guided Lab & Visualizer</title>
    <meta name="description" content="Interactive web-based RSA Cryptography laboratory visualizing key generation, encryption, transmission, and decryption." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #080c14;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #f1f5f9;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #1e1b4b 0%, #080c14 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .spinner-wrapper {
        position: relative;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      .spinner {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid rgba(129, 140, 248, 0.15);
        border-top-color: #818cf8;
        border-right-color: #c084fc;
        border-radius: 50%;
        animation: spin 1.1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      }
      .spinner-icon {
        font-size: 28px;
        user-select: none;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .loading-title {
        font-size: 24px;
        font-weight: 800;
        background: linear-gradient(90deg, #818cf8 0%, #c084fc 50%, #e879f9 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }
      .loading-sub {
        font-size: 14px;
        color: #94a3b8;
        font-weight: 500;
      }
      .loading-badge {
        margin-top: 20px;
        padding: 6px 14px;
        background: rgba(129, 140, 248, 0.1);
        border: 1px solid rgba(129, 140, 248, 0.25);
        border-radius: 9999px;
        font-size: 12px;
        font-family: 'JetBrains Mono', monospace;
        color: #a5b4fc;
      }
    </style>
  </head>
  <body>
    <div id="loader" class="loading-screen">
      <div class="spinner-wrapper">
        <div class="spinner"></div>
        <div class="spinner-icon">🔐</div>
      </div>
      <div class="loading-title">RSA Cryptography Guided Lab</div>
      <div class="loading-sub">Loading interactive WebAssembly environment...</div>
      <div class="loading-badge">Stlite WebAssembly Engine</div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
    <script>
      fetch('./app.py')
        .then(function(res) {
          if (!res.ok) {
            throw new Error("HTTP error " + res.status);
          }
          return res.text();
        })
        .then(function(code) {
          stlite.mount(
            {
              entrypoint: "app.py",
              files: {
                "app.py": code,
              },
              streamlitConfig: {
                "theme.base": "dark",
                "theme.backgroundColor": "#0b0f19",
                "theme.secondaryBackgroundColor": "#151d2a",
                "theme.textColor": "#f8fafc",
                "theme.primaryColor": "#6366f1"
              }
            },
            document.getElementById("root")
          );
          setTimeout(function() {
            var loader = document.getElementById("loader");
            if (loader) {
              loader.style.opacity = "0";
              loader.style.visibility = "hidden";
            }
          }, 600);
        })
        .catch(function(err) {
          console.error("Failed to load app.py:", err);
          var sub = document.querySelector(".loading-sub");
          if (sub) {
            sub.textContent = "Error loading application script: " + err.message;
            sub.style.color = "#ef4444";
          }
        });
    </script>
  </body>
</html>
